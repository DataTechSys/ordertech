steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        if [[ "${_REGION}" != "me-central1" ]]; then
          echo "ERROR: _REGION must be me-central1 (got '${_REGION}')" >&2
          exit 1
        fi
        if [[ "${_AR_LOCATION}" != "me-central1" ]]; then
          echo "ERROR: _AR_LOCATION must be me-central1 (got '${_AR_LOCATION}')" >&2
          exit 1
        fi

  # Monitor build context size to ensure optimizations are working
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Check build context size
    entrypoint: bash
    args:
      - -c
      - |
        echo "[info] Measuring build context size..."
        tar --exclude-from=.dockerignore -cf - . | wc -c | awk '{printf("[info] Build context: %.2f MB\n",$1/1024/1024)}'

  - name: gcr.io/cloud-builders/docker
    id: Pull cache image
    entrypoint: bash
    args:
      - -c
      - docker pull ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:latest || true

  - name: gcr.io/cloud-builders/docker
    id: Build image (with cache)
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --cache-from=${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:latest
      - -t
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:$BUILD_ID
      - -t
      - ${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push build-id tag
    args: ['push','${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:$BUILD_ID']

  - name: gcr.io/cloud-builders/docker
    id: Push latest tag
    args: ['push','${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:latest']

  # Create or update the Cloud Run Job for DB migrations (parameterized)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        JOB="${_MIGRATION_JOB}"
        IMAGE="${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:$BUILD_ID"
        REGION="${_REGION}"
        INSTANCE="${_DB_INSTANCE}"
        SECRET="${_DB_SECRET}"
        if gcloud run jobs describe "$$JOB" --region "$$REGION" >/dev/null 2>&1; then
          gcloud run jobs update "$$JOB" \
            --image "$$IMAGE" \
            --region "$$REGION" \
            --command node \
            --args scripts/migrate.js \
            --set-secrets "DATABASE_URL=$${SECRET}:latest" \
            --set-env-vars "PGHOST=/cloudsql/$$INSTANCE,PGPORT=5432" \
            --set-cloudsql-instances "$$INSTANCE"
        else
          gcloud run jobs create "$$JOB" \
            --image "$$IMAGE" \
            --region "$$REGION" \
            --command node \
            --args scripts/migrate.js \
            --set-secrets "DATABASE_URL=$${SECRET}:latest" \
            --set-env-vars "PGHOST=/cloudsql/$$INSTANCE,PGPORT=5432" \
            --set-cloudsql-instances "$$INSTANCE"
        fi

  # Execute the migration job and wait for completion
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        echo "[info] Executing migration job ${_MIGRATION_JOB} (non-blocking)"
        gcloud run jobs execute "${_MIGRATION_JOB}" --region "${_REGION}" --wait || echo "[warn] Migration job failed; continuing pipeline"

  # Deploy the service with Cloud SQL and DATABASE_URL secret configured
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        'run','deploy','${_SERVICE}',
        '--image','${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:$BUILD_ID',
        '--region','${_REGION}',
        '--platform','managed',
        '--port','3000',
        '--timeout','3600',
        '--set-secrets','DATABASE_URL=${_DB_SECRET}:latest,LIVEKIT_API_KEY=${_LK_KEY_SECRET}:latest,LIVEKIT_API_SECRET=${_LK_SEC_SECRET}:latest,OPENAI_API_KEY=${_OPENAI_API_SECRET}:latest,OPENAI_ASSISTANT_ID=${_OPENAI_ASSISTANT_SECRET}:latest',
        '--add-cloudsql-instances','${_DB_INSTANCE}',
        '--update-env-vars','ASSETS_BUCKET=${_ASSETS_BUCKET}',
        '--update-env-vars','TENANTS_UI_BASE=https://storage.googleapis.com/${_ASSETS_BUCKET}/tenants/',
        '--update-env-vars','PGHOST=/cloudsql/${_DB_INSTANCE},PGPORT=5432,JOB_COMMAND=,REQUIRE_DB=false,NODE_ENV=production,ENCRYPTION_KEY=f43b899fff9800a4cb1c1766398e792c7cd47889dc546fe3414964d436a11618',
        '--command','node',
        '--args','server.js'
      ]

images:
  - '${_AR_LOCATION}-docker.pkg.dev/$PROJECT_ID/ordertech/${_SERVICE}:$BUILD_ID'

substitutions:
  _REGION: me-central1
  _AR_LOCATION: me-central1
  _SERVICE: ordertech
  _MIGRATION_JOB: migrate-ordertech
  _DB_SECRET: DATABASE_URL
  _DB_INSTANCE: smart-order-469705:me-central1:ordertech-db
  _ASSETS_BUCKET: ordertech.me
  _LK_KEY_SECRET: livekit-api-key
  _LK_SEC_SECRET: livekit-api-secret
  _OPENAI_API_SECRET: openai-api-key
  _OPENAI_ASSISTANT_SECRET: openai-assistant-id
