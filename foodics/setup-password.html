<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Password - DataTech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .setup-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem 2rem;
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        h1 { color: #1f2937; font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { color: #6b7280; text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #319795;
        }
        .hint { color: #6b7280; font-size: 0.875rem; margin-top: 0.25rem; }
        .password-requirements {
            background: #f3f4f6;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .requirement {
            color: #6b7280;
            margin: 0.25rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .requirement.met { color: #10b981; }
        .requirement.met:before { content: '✓'; }
        .requirement:not(.met):before { content: '○'; }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #319795 0%, #2c7a7b 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(49, 151, 149, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo">
            <img src="/foodics/datatech-logo.png" alt="DataTech" style="height: 50px;">
        </div>
        
        <h1>Set Up Your Password</h1>
        <p class="subtitle">Create a secure password for your DataTech account</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="passwordForm">
            <div class="form-group">
                <label for="password">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            
            <div class="password-requirements">
                <strong>Password must contain:</strong>
                <div class="requirement" id="req-length">At least 8 characters</div>
                <div class="requirement" id="req-uppercase">One uppercase letter</div>
                <div class="requirement" id="req-lowercase">One lowercase letter</div>
                <div class="requirement" id="req-number">One number</div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >
                <div class="hint" id="matchHint"></div>
            </div>
            
            <button type="submit" class="btn-primary" id="submitBtn">
                Set Password & Complete Registration
            </button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            showAlert('Invalid or missing verification token', 'error');
            document.getElementById('submitBtn').disabled = true;
        }
        
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const form = document.getElementById('passwordForm');
        const matchHint = document.getElementById('matchHint');
        
        // Password validation
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            
            // Check requirements
            document.getElementById('req-length').classList.toggle('met', password.length >= 8);
            document.getElementById('req-uppercase').classList.toggle('met', /[A-Z]/.test(password));
            document.getElementById('req-lowercase').classList.toggle('met', /[a-z]/.test(password));
            document.getElementById('req-number').classList.toggle('met', /[0-9]/.test(password));
            
            checkPasswordMatch();
        });
        
        confirmInput.addEventListener('input', checkPasswordMatch);
        
        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (confirm.length === 0) {
                matchHint.textContent = '';
                matchHint.style.color = '';
            } else if (password === confirm) {
                matchHint.textContent = '✓ Passwords match';
                matchHint.style.color = '#10b981';
            } else {
                matchHint.textContent = '✗ Passwords do not match';
                matchHint.style.color = '#ef4444';
            }
        }
        
        function validatePassword(password) {
            return password.length >= 8 &&
                   /[A-Z]/.test(password) &&
                   /[a-z]/.test(password) &&
                   /[0-9]/.test(password);
        }
        
        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            
            // Validate
            if (!validatePassword(password)) {
                showAlert('Password does not meet all requirements');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Setting up your account...';
            
            try {
                const response = await fetch(`${API_BASE}/api/foodics/auth/setup-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showAlert('Account setup complete! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/foodics/login.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to set password');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set Password & Complete Registration';
                }
            } catch (error) {
                console.error('Setup error:', error);
                showAlert('Network error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set Password & Complete Registration';
            }
        });
    </script>
</body>
</html>
