steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/foodics-sync-ingredients:latest'
      - '-f'
      - 'Dockerfile.ingredients'
      - '.'
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foodics-sync-ingredients:latest']
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'foodics-sync-ingredients'
      - '--image'
      - 'gcr.io/$PROJECT_ID/foodics-sync-ingredients:latest'
      - '--region'
      - 'me-central1'
      - '--set-env-vars'
      - 'DB_HOST=/cloudsql/smart-order-469705:me-central1:ordertech-db,DB_PORT=5432,DB_NAME=ordertech,DB_USER=ordertech'
      - '--set-secrets'
      - 'DB_PASSWORD=DB_PASSWORD:latest,FOODICS_TOKEN=FOODICS_TOKEN:latest'
      - '--set-cloudsql-instances'
      - 'smart-order-469705:me-central1:ordertech-db'
      - '--max-retries'
      - '0'
      - '--task-timeout'
      - '30m'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/foodics-sync-ingredients:latest'
