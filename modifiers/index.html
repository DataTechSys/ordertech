<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OrderTech — Modifiers</title>
    <link rel="stylesheet" href="/css/admin.css?v=20250908-1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" />
    <script src="/config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <header class="topbar">
      <nav class="breadcrumbs"><a id="tenantNameCrumb" href="#">—</a><span class="sep">›</span><span>Modifiers</span></nav>
      <div class="searchbar">
        <select id="tenantSelect" class="select"></select>
      </div>
      <button class="btn icon ghost only-mobile" id="mobileMenu" aria-label="Toggle menu">☰</button>
    </header>
    <main class="main">
      <section class="card">
        <div class="body">
          <div class="toolbar">
            <div id="modGrpBulkBar" class="flex hidden" style="gap:8px; margin-right:8px;">
              <select id="modGrpBulkAction" class="select" style="max-width:220px">
                <option value="delete">Delete</option>
              </select>
              <button id="modGrpBulkApply" class="btn danger">Apply</button>
            </div>
            <div id="modOptBulkBar" class="flex hidden" style="gap:8px; margin-right:8px;">
              <select id="modOptBulkAction" class="select" style="max-width:220px">
                <option value="delete">Delete</option>
                <option value="inactivate">Inactivate</option>
              </select>
              <button id="modOptBulkApply" class="btn danger">Apply</button>
            </div>
            <button id="newGroupBtn" class="btn">New Group</button>
            <button id="newOptionBtn" class="btn">New Option</button>
            <div class="flex" style="gap:8px; margin-left:8px;">
              <button id="btnModImport" class="btn"><span class="icon ri ri-download-2-line"></span><span>Import</span></button>
              <button id="btnModExport" class="btn"><span class="icon ri ri-upload-2-line"></span><span>Export CSV</span></button>
              <button id="btnModSync" class="btn"><span class="icon ri ri-refresh-line"></span><span>Sync</span></button>
              <button id="btnMoveInactive" class="btn"><span class="icon ri ri-delete-bin-line"></span><span>Move Inactive to Deleted</span></button>
            </div>
            <div class="spacer"></div>
          </div>
          <div class="tabs" id="modTabs">
            <button class="tab active" data-tab="groups">Groups</button>
            <button class="tab" data-tab="options">Options</button>
          </div>

          <!-- Filter tabs for Groups -->
          <div id="groupsFilterTabs" class="tabs" style="margin-top: 8px; margin-bottom: 8px;">
            <button class="tab active" data-filter="active">Available</button>
            <button class="tab" data-filter="inactive">Deleted</button>
          </div>

          <!-- Filter tabs for Options -->
          <div id="optionsFilterTabs" class="tabs" style="margin-top: 8px; margin-bottom: 8px; display: none;">
            <button class="tab active" data-filter="active">Active</button>
            <button class="tab" data-filter="inactive">Inactive</button>
          </div>

          <div id="groupsTableWrap"></div>
          <div id="optionsTableWrap" style="display:none;"></div>

          <div id="modPagination" class="toolbar" style="margin-top:12px; display:none;">
            <div class="btn-group">
              <button id="modPrev" class="btn">Prev</button>
              <button id="modNext" class="btn">Next</button>
            </div>
            <span class="spacer"></span>
            <div class="flex center" style="gap:8px; align-items:center;">
              <span class="label" style="white-space: nowrap;">Page size</span>
              <select id="modPageSize" class="select">
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>
            <div id="modPageInfo" class="chip">—</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Import Modifiers Modal -->
    <div id="modImportModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modImportTitle">
        <div class="header">
          <div class="title" id="modImportTitle">Import Modifiers</div>
          <button id="modImportClose" class="btn icon ghost" aria-label="Close">✕</button>
        </div>
        <div class="content">
          <div class="row cols-2">
            <label class="grid"><span class="label">Groups CSV</span>
              <input id="modImportGroups" type="file" accept=".csv,text/csv" />
              <small class="muted">Template: <a href="/data/templates/modifiers.csv" target="_blank" rel="noopener">modifiers.csv</a></small>
            </label>
            <label class="grid"><span class="label">Options CSV</span>
              <input id="modImportOptions" type="file" accept=".csv,text/csv" />
              <small class="muted">Template: <a href="/data/templates/modifiers_options.csv" target="_blank" rel="noopener">modifiers_options.csv</a></small>
            </label>
          </div>
          <div class="row">
            <div class="grid" style="gap:6px;">
              <label class="checkbox-row" style="gap:8px"><input id="modImportUpdateGroups" type="checkbox" /> <span>Update existing groups (fill missing fields only)</span></label>
              <label class="checkbox-row" style="gap:8px"><input id="modImportUpdateOptions" type="checkbox" /> <span>Update existing options (fill missing fields only)</span></label>
              <label class="checkbox-row" style="gap:8px"><input id="modImportReactivateOptions" type="checkbox" /> <span>Reactivate options if inactive</span></label>
            </div>
          </div>
          <div class="stack" style="gap:8px;">
            <div class="muted">Groups Preview</div>
            <div id="modImportPreviewGroups"></div>
            <div class="muted">Options Preview</div>
            <div id="modImportPreviewOptions"></div>
          </div>
        </div>
        <div class="footer">
          <span id="modImportStatus" class="muted">—</span>
          <span class="spacer"></span>
          <button id="modImportCancel" class="btn">Cancel</button>
          <button id="modImportConfirm" class="btn primary">Import</button>
        </div>
      </div>
    </div>

    <!-- Group Modal -->
    <div id="groupModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
        <div class="header">
          <div class="title" id="groupModalTitle">Modifier Group</div>
          <button id="groupModalClose" class="btn icon ghost" aria-label="Close">✕</button>
        </div>
        <div class="content">
          <div class="row cols-2">
            <label class="grid"><span class="label">Name</span>
              <input id="grpFormName" class="input"/>
            </label>
            <label class="grid"><span class="label">Name Localized</span>
              <input id="grpFormNameLoc" class="input" placeholder="Optional localized name"/>
            </label>
            <label class="grid"><span class="label">Reference</span>
              <input id="grpFormRef" class="input" placeholder="Optional reference"/>
            </label>
          </div>
          <div id="grpAdvRow" class="row cols-3" style="display:none;">
            <label class="grid"><span class="label">Min Select</span>
              <input id="grpFormMin" type="number" step="1" min="0" class="input"/>
            </label>
            <label class="grid"><span class="label">Max Select</span>
              <input id="grpFormMax" type="number" step="1" min="0" class="input"/>
            </label>
            <label class="switch-row"><span class="label">Required</span>
              <input id="grpFormRequired" type="checkbox" class="switch"/>
            </label>
          </div>
        </div>
        <div class="footer">
          <button id="groupModalDelete" class="btn danger hidden">Delete</button>
          <span class="spacer"></span>
          <button id="groupModalCancel" class="btn">Cancel</button>
          <button id="groupModalSave" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Option Modal -->
    <div id="optionModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="optionModalTitle">
        <div class="header">
          <div class="title" id="optionModalTitle">Modifier Option</div>
          <button id="optionModalClose" class="btn icon ghost" aria-label="Close">✕</button>
        </div>
        <div class="content">
          <div class="row cols-2">
            <label class="grid"><span class="label">Name</span>
              <input id="optFormName" class="input"/>
            </label>
            <label class="grid"><span class="label">Group</span>
              <select id="optFormGroup" class="select"></select>
            </label>
          </div>
          <div class="row cols-2">
            <label class="grid"><span class="label">SKU</span>
              <div class="flex" style="gap:8px; align-items:center;">
                <input id="optFormRef" class="input" placeholder="e.g. sk-0001" />
                <button id="optGenSKU" class="btn sm" type="button">Generate</button>
              </div>
            </label>
          </div>
          <div class="row cols-3">
            <label class="grid"><span class="label">Price (KWD)</span>
              <input id="optFormPrice" type="number" step="0.001" min="0" class="input"/>
            </label>
            <label class="grid"><span class="label">Tax Group</span>
              <input id="optFormTax" class="input" placeholder="Optional (e.g. VAT-5%)"/>
            </label>
            <label class="grid"><span class="label">Costing Method</span>
              <select id="optFormCost" class="select">
                <option value="fixed" selected>Fixed</option>
                <option value="from_ingredients">From Ingredients</option>
              </select>
            </label>
          </div>
          <div class="row cols-2">
            <label class="grid"><span class="label">Sort Order</span>
              <input id="optFormSort" type="number" step="1" class="input"/>
            </label>
            <label class="switch-row"><span class="label">Active</span>
              <input id="optFormActive" type="checkbox" class="switch"/>
            </label>
          </div>
          <div class="row cols-2">
            <label class="grid"><span class="label">Name Localized</span>
              <input id="optFormNameLoc" class="input"/>
            </label>
          </div>
        </div>
        <div class="footer">
          <button id="optionModalDelete" class="btn danger hidden">Delete</button>
          <span class="spacer"></span>
          <button id="optionModalCancel" class="btn">Cancel</button>
          <button id="optionModalSave" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Sync Preview Modal -->
    <div id="syncPreviewModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal large" role="dialog" aria-modal="true" aria-labelledby="syncPreviewTitle">
        <div class="header">
          <div class="title" id="syncPreviewTitle">Modifier Sync Preview</div>
          <button id="syncPreviewClose" class="btn icon ghost" aria-label="Close">✕</button>
        </div>
        <div class="content">
          <div class="stack" style="gap:16px;">
            <div class="alert info">
              <span class="icon ri-information-line"></span>
              <div>
                <strong>Review Modifier Changes</strong><br>
                The following modifier groups and options will be synced from Foodics. Select which items you want to sync.
              </div>
            </div>
            
            <div id="syncPreviewContent">
              <div class="loader">Loading preview...</div>
            </div>
          </div>
        </div>
        <div class="footer">
          <div id="syncPreviewSummary" class="muted">—</div>
          <span class="spacer"></span>
          <button id="syncPreviewCancel" class="btn">Cancel</button>
          <button id="syncPreviewConfirm" class="btn primary" disabled>Sync Selected</button>
        </div>
      </div>
    </div>

    <script src="/js/admin-common.js?v=20250908-1"></script>
    <script src="/js/admin-shell.js?v=20250908-1"></script>
    <script src="/js/importer.js?v=20250908-1"></script>
    <script src="/js/modifiers.js?v=20251001-5"></script>
  </body>
</html>
