<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Whisper Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .button { padding: 15px 25px; margin: 10px; font-size: 18px; border-radius: 5px; border: none; cursor: pointer; }
        .start { background: #28a745; color: white; }
        .stop { background: #dc3545; color: white; }
        .test { background: #007bff; color: white; }
        .log { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; font-family: monospace; font-size: 14px; white-space: pre-wrap; max-height: 500px; overflow-y: auto; margin-top: 20px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .transcript { background: #e7f3ff; border-left: 4px solid #007bff; padding: 10px; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🎙️ Simple Whisper Test (Manual Control)</h1>
    
    <div>
        <button class="button start" onclick="startRecording()" id="startBtn">▶️ Start Recording</button>
        <button class="button stop" onclick="stopRecording()" id="stopBtn" disabled>⏹️ Stop Recording</button>
        <button class="button test" onclick="testServer()">🔗 Test Server</button>
        <button class="button" onclick="clearLog()">🗑️ Clear Log</button>
    </div>
    
    <div id="transcript" class="transcript" style="display: none;">
        <strong>Transcript:</strong> <span id="transcriptText">...</span>
    </div>
    
    <h3>Debug Log:</h3>
    <div class="log" id="log"></div>

    <script type="module">
        import { WhisperSTTClient } from './js/ai/openai-whisper-client.js';
        
        let whisperClient = null;
        let isRecording = false;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : (type === 'success' ? 'success' : '');
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[Whisper Simple] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('transcript').style.display = 'none';
        }
        
        function showTranscript(text) {
            const transcriptDiv = document.getElementById('transcript');
            const transcriptText = document.getElementById('transcriptText');
            transcriptText.textContent = text;
            transcriptDiv.style.display = 'block';
        }
        
        async function testServer() {
            try {
                log('Testing server connection...');
                const response = await fetch('http://localhost:3000/health');
                if (response.ok) {
                    const result = await response.text();
                    log('✅ Server is running: ' + result, 'success');
                } else {
                    log('❌ Server error: ' + response.status, 'error');
                }
            } catch (error) {
                log('❌ Server connection failed: ' + error.message, 'error');
            }
        }
        
        window.startRecording = async function() {
            try {
                if (isRecording) {
                    log('Already recording...');
                    return;
                }
                
                log('=== Starting Simple Whisper Recording ===');
                
                // Create Whisper client with simple settings
                whisperClient = new WhisperSTTClient({
                    language: 'ar-KW',
                    baseURL: 'http://localhost:3000',
                    continuous: false, // Manual control
                    interimResults: false, // Only final results
                    chunkDuration: 30000, // 30 seconds - let user control
                    silenceThreshold: 0.001, // Very sensitive
                    maxSilence: 30000, // 30 seconds before auto-stop
                    minAudioDuration: 1000 // 1 second minimum
                });
                
                // Set up event handlers
                whisperClient.on('start', () => {
                    log('✅ Recording started', 'success');
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    isRecording = true;
                });
                
                whisperClient.on('end', () => {
                    log('⏹️ Recording ended');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    isRecording = false;
                });
                
                whisperClient.on('partial', (data) => {
                    log(`🎯 Partial transcript: "${data.transcript}"`, 'success');
                });
                
                whisperClient.on('final', (data) => {
                    log(`✨ Final transcript: "${data.transcript}"`, 'success');
                    showTranscript(data.transcript);
                });
                
                whisperClient.on('error', (error) => {
                    log(`❌ Whisper Error: ${error.message}`, 'error');
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    isRecording = false;
                });
                
                // Start recording
                await whisperClient.start();
                
            } catch (error) {
                log(`❌ Failed to start recording: ${error.message}`, 'error');
                isRecording = false;
            }
        };
        
        window.stopRecording = function() {
            if (whisperClient && isRecording) {
                log('Stopping recording manually...');
                whisperClient.stop();
            }
        };
        
        // Test server on load
        window.onload = async function() {
            log('Simple Whisper test loaded');
            await testServer();
            log('');
            log('Instructions:');
            log('1. Click "Start Recording"');
            log('2. Speak in Arabic (Kuwaiti dialect preferred)'); 
            log('3. Click "Stop Recording" when done');
            log('4. Wait for transcription result');
        };
    </script>
</body>
</html>
