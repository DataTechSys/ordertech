substitutions:
  _IMAGE_TAG: '${SHORT_SHA:-latest}'

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/admin-ordertech-me:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/admin-ordertech-me:latest'
      - '-f'
      - 'WebApp/OrderTech.SuperAdmin.WebApp/Dockerfile'
      - '.'
    dir: 'admin'

  # Push the Docker images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/admin-ordertech-me'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'admin-ordertech-me'
      - '--image=gcr.io/$PROJECT_ID/admin-ordertech-me:${_IMAGE_TAG}'
      - '--region=me-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=3600s'
      - '--min-instances=1'
      - '--max-instances=5'
      - '--set-env-vars=ASPNETCORE_ENVIRONMENT=Production'
      - '--set-secrets=ConnectionStrings__DefaultConnection=DATABASE_URL:latest'

images:
  - 'gcr.io/$PROJECT_ID/admin-ordertech-me:${_IMAGE_TAG}'
  - 'gcr.io/$PROJECT_ID/admin-ordertech-me:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
