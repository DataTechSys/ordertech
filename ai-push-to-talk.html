<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Push-to-Talk AI - اضغط واتكلم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 10px 0;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .start-btn { 
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white; 
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(76,175,80,0.4); }
        
        .stop-btn { 
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white; 
        }
        .stop-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244,67,54,0.4); }
        
        .talk-btn {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
            font-size: 20px;
            padding: 20px 40px;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
        }
        .talk-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .talk-btn:not(:disabled):hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,152,0,0.4);
        }
        
        .talk-btn.recording {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .status {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            font-weight: bold;
            font-size: 18px;
        }
        
        .conversation {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            animation: slideIn 0.3s ease-out;
        }
        
        .message.user {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            margin-left: 50px;
        }
        
        .message.assistant {
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            margin-right: 50px;
        }
        
        .message.system {
            background: rgba(255,255,255,0.1);
            font-style: italic;
            opacity: 0.8;
            text-align: center;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .instructions {
            background: rgba(255,193,7,0.2);
            border: 1px solid rgba(255,193,7,0.5);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .debug {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 مساعد كوبز الصوتي</h1>
            <p>اضغط واستمر للتحدث - تحكم كامل بالتسجيل</p>
        </div>
        
        <div class="instructions">
            <strong>📋 التعليمات:</strong><br>
            1️⃣ اضغط "بدء المحادثة"<br>
            2️⃣ اضغط واستمر على "اضغط للتكلم" أثناء الحديث<br>
            3️⃣ اترك الزر عندما تنتهي من الكلام<br>
            4️⃣ انتظر رد الذكاء الاصطناعي
        </div>
        
        <div class="controls">
            <button id="startBtn" class="start-btn" onclick="startConversation()">
                🚀 بدء المحادثة
            </button>
            <button id="stopBtn" class="stop-btn" onclick="stopConversation()" disabled>
                ⏹️ إنهاء المحادثة
            </button>
        </div>
        
        <div class="controls">
            <button id="talkBtn" class="talk-btn" 
                    onmousedown="startRecording()" 
                    onmouseup="stopRecording()" 
                    ontouchstart="startRecording()" 
                    ontouchend="stopRecording()"
                    disabled>
                🎤 اضغط للتكلم
            </button>
        </div>
        
        <div id="status" class="status">جاهز للبداية</div>
        
        <div id="conversation" class="conversation"></div>
        
        <div id="debug" class="debug">Debug: Ready...</div>
    </div>

    <script>
        console.log('🎤 Push-to-Talk AI loaded');
        
        const BASE_URL = 'http://localhost:3000';
        
        // State management
        let isActive = false;
        let token = null;
        let sessionId = null;
        let isRecording = false;
        let currentMediaRecorder = null;
        let currentStream = null;
        let currentAudio = null;
        
        // Voice consistency - select once per conversation
        let conversationVoice = null;
        
        function log(message) {
            console.log(message);
            const debug = document.getElementById('debug');
            debug.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
        }
        
        function addMessage(type, text) {
            const conversation = document.getElementById('conversation');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            const icon = type === 'user' ? '🗣️ أنت' : 
                        type === 'assistant' ? '🤖 كوبز' : '💻 النظام';
            
            div.innerHTML = `<strong>${icon}:</strong> ${text}`;
            conversation.appendChild(div);
            conversation.scrollTop = conversation.scrollHeight;
        }
        
        function updateStatus(text, color = '#fff') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.color = color;
        }
        
        async function startConversation() {
            try {
                log('🚀 Starting push-to-talk conversation...');
                isActive = true;
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('talkBtn').disabled = false;
                
                updateStatus('جاري التهيئة...', '#FFD700');
                
                // Get token
                const tokenResponse = await fetch(`${BASE_URL}/ai/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: 'push-to-talk-' + Date.now(),
                        branch_name: 'Koobs Restaurant'
                    })
                });
                
                if (!tokenResponse.ok) throw new Error('Token request failed');
                const tokenData = await tokenResponse.json();
                token = tokenData.token;
                log('✅ Token received');
                
                // Create session
                const sessionResponse = await fetch(`${BASE_URL}/ai/sessions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        language: 'ar', // Standard Arabic for better compatibility
                        settings: { mode: 'push_to_talk' }
                    })
                });
                
                if (!sessionResponse.ok) throw new Error('Session creation failed');
                const sessionData = await sessionResponse.json();
                sessionId = sessionData.session_id;
                log('✅ Session created');
                
                // Select voice for this entire conversation
                const voices = [
                    { name: 'shimmer', displayName: 'روان', gender: 'female' }, // Rawan - soft and gentle
                    { name: 'alloy', displayName: 'أحمد', gender: 'male' }        // Ahmad - clear and neutral
                ];
                conversationVoice = voices[Math.floor(Math.random() * voices.length)];
                log(`🎭 Selected voice for conversation: ${conversationVoice.displayName} (${conversationVoice.name})`);
                
                // AI greeting
                addMessage('system', `بدء المحادثة مع ${conversationVoice.displayName}...`);
                await speakAIMessage('أهلاً وسهلاً بك في مطعم كوبز! اضغط على الزر وقل لي كيف أساعدك؟');
                
                updateStatus('✅ جاهز - اضغط واستمر على "اضغط للتكلم"', '#4CAF50');
                
            } catch (error) {
                log('❌ Setup error: ' + error.message);
                addMessage('system', 'خطأ في بدء المحادثة: ' + error.message);
                resetControls();
            }
        }
        
        function stopConversation() {
            log('🛑 Stopping conversation...');
            isActive = false;
            
            // Stop any ongoing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            // Stop recording if active
            if (isRecording) {
                stopRecording();
            }
            
            resetControls();
            addMessage('system', 'تم إنهاء المحادثة');
            updateStatus('تم إنهاء المحادثة', '#f44336');
            
            // Reset voice selection for next conversation
            conversationVoice = null;
        }
        
        function resetControls() {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('talkBtn').disabled = true;
            document.getElementById('talkBtn').classList.remove('recording');
        }
        
        async function speakAIMessage(text) {
            if (!isActive) return;
            
            try {
                // Use consistent voice selected for this conversation
                if (!conversationVoice) {
                    // Fallback if voice not selected (shouldn't happen)
                    const voices = [
                        { name: 'shimmer', displayName: 'روان', gender: 'female' },
                        { name: 'alloy', displayName: 'أحمد', gender: 'male' }
                    ];
                    conversationVoice = voices[0]; // Default to Rawan
                }
                
                log(`🔊 ${conversationVoice.displayName} يتكلم...`);
                updateStatus(`🤖 ${conversationVoice.displayName} يتكلم...`, '#4CAF50');
                addMessage('assistant', text);
                
                const response = await fetch(`${BASE_URL}/tts/synthesize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        language: 'ar', // Standard Arabic
                        voice: conversationVoice.name, // Consistent voice for entire conversation
                        model: 'tts-1', // Standard model - stable and clear
                        speed: 1.0 // Perfect speed for Arabic
                    })
                });
                
                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    currentAudio = new Audio(audioUrl);
                    
                    return new Promise((resolve, reject) => {
                        currentAudio.onended = () => {
                            URL.revokeObjectURL(audioUrl);
                            currentAudio = null;
                            log('✅ AI finished speaking');
                            updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                            resolve();
                        };
                        currentAudio.onerror = reject;
                        currentAudio.play().catch(reject);
                    });
                }
            } catch (error) {
                log('❌ TTS error: ' + error.message);
                updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
            }
        }
        
        async function startRecording() {
            if (!isActive || isRecording) return;
            
            try {
                log('🔴 Starting recording - keep holding button...');
                isRecording = true;
                
                document.getElementById('talkBtn').classList.add('recording');
                document.getElementById('talkBtn').textContent = '🔴 جاري التسجيل...';
                updateStatus('🎤 جاري التسجيل - استمر في الضغط', '#f44336');
                
                // Get microphone with SPECIFIC built-in device
                const devices = await navigator.mediaDevices.enumerateDevices();
                const builtInMic = devices.find(device => 
                    device.kind === 'audioinput' && 
                    device.label.includes('iMac Microphone (Built-in)')
                );
                
                const constraints = {
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1,
                        sampleRate: 16000, // Lower sample rate for better isolation
                        deviceId: builtInMic ? { exact: builtInMic.deviceId } : undefined
                    }
                };
                
                log('🎤 Using device: ' + (builtInMic ? builtInMic.label : 'default'));
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                currentMediaRecorder = new MediaRecorder(currentStream, {
                    mimeType: MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm'
                });
                
                const audioChunks = [];
                
                currentMediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                currentMediaRecorder.onstop = async () => {
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }
                    
                    if (!isActive || audioChunks.length === 0) return;
                    
                    try {
                        updateStatus('🤖 جاري معالجة كلامك...', '#FF9800');
                        
                        const audioBlob = new Blob(audioChunks, { type: currentMediaRecorder.mimeType });
                        log(`📦 Audio recorded: ${audioBlob.size} bytes`);
                        
                        if (audioBlob.size < 500) {
                            log('⚠️ Audio too short');
                            updateStatus('⚠️ تسجيل قصير جداً - حاول مرة أخرى', '#FF9800');
                            setTimeout(() => {
                                if (isActive) updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                            }, 1500);
                            return;
                        }
                        
                        // Transcribe
                        const transcribeResponse = await fetch(`${BASE_URL}/ai/whisper/transcribe`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': currentMediaRecorder.mimeType,
                                'X-Language': 'ar'
                            },
                            body: audioBlob
                        });
                        
                        if (transcribeResponse.ok) {
                            const result = await transcribeResponse.json();
                            log(`🗣️ Transcribed: "${result.text}"`);
                            
                            if (result.text && result.text.trim().length > 1) {
                                addMessage('user', result.text);
                                await getAIResponse(result.text.trim());
                            } else {
                                log('⚠️ No clear speech detected');
                                updateStatus('⚠️ لم أسمع كلاماً واضحاً - حاول مرة أخرى', '#FF9800');
                                setTimeout(() => {
                                    if (isActive) updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                                }, 2000);
                            }
                        } else {
                            throw new Error('Transcription failed');
                        }
                        
                    } catch (error) {
                        log('❌ Processing error: ' + error.message);
                        updateStatus('❌ خطأ في المعالجة - حاول مرة أخرى', '#f44336');
                        setTimeout(() => {
                            if (isActive) updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                        }, 2000);
                    }
                };
                
                currentMediaRecorder.start();
                log('🎤 Recording started - release button to stop');
                
            } catch (error) {
                log('❌ Recording error: ' + error.message);
                isRecording = false;
                document.getElementById('talkBtn').classList.remove('recording');
                document.getElementById('talkBtn').textContent = '🎤 اضغط للتكلم';
                updateStatus('❌ خطأ في التسجيل: ' + error.message, '#f44336');
            }
        }
        
        function stopRecording() {
            if (!isRecording || !currentMediaRecorder) return;
            
            log('⏹️ Recording stopped by user');
            isRecording = false;
            
            document.getElementById('talkBtn').classList.remove('recording');
            document.getElementById('talkBtn').textContent = '🎤 اضغط للتكلم';
            
            if (currentMediaRecorder.state === 'recording') {
                currentMediaRecorder.stop();
            }
        }
        
        async function getAIResponse(userText) {
            if (!isActive) return;
            
            try {
                log('🤖 Getting AI response...');
                updateStatus('🤖 AI يفكر...', '#FF9800');
                
                const response = await fetch(`${BASE_URL}/ai/chat/stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        messages: [{
                            role: 'user',
                            content: userText
                        }]
                    })
                });
                
                if (!response.ok) throw new Error('AI request failed');
                
                let aiResponse = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line === 'data: [DONE]') {
                            log(`🤖 AI response: "${aiResponse.substring(0, 50)}..."`);
                            
                            if (aiResponse.trim() && isActive) {
                                await speakAIMessage(aiResponse.trim());
                            } else {
                                updateStatus('⚠️ AI لم يرد - حاول مرة أخرى', '#FF9800');
                                setTimeout(() => {
                                    if (isActive) updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                                }, 2000);
                            }
                            return;
                        }
                        
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'content_delta') {
                                    aiResponse += data.delta;
                                }
                            } catch (parseError) {
                                // Ignore
                            }
                        }
                    }
                }
                
            } catch (error) {
                log('❌ AI error: ' + error.message);
                addMessage('system', 'خطأ في الذكاء الاصطناعي: ' + error.message);
                updateStatus('❌ خطأ - حاول مرة أخرى', '#f44336');
                setTimeout(() => {
                    if (isActive) updateStatus('✅ جاهز - اضغط واستمر للتكلم', '#4CAF50');
                }, 2000);
            }
        }
        
        // Initialize
        log('🎤 Push-to-Talk ready');
        updateStatus('اضغط "بدء المحادثة" للبدء');
        
        // Prevent context menu on long press
        document.getElementById('talkBtn').addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // Show available microphones
        if (navigator.mediaDevices) {
            navigator.mediaDevices.enumerateDevices()
                .then(devices => {
                    const audioInputs = devices.filter(device => device.kind === 'audioinput');
                    log(`Available mics: ${audioInputs.length}`);
                    audioInputs.forEach((device, index) => {
                        console.log(`Mic ${index + 1}: ${device.label || 'Unknown'}`);
                    });
                });
        }
    </script>
</body>
</html>
