  # pgAdmin (database admin UI - connects to both local Postgres and Cloud SQL)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ordertech-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@ordertech.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-devpassword}
      - PGADMIN_LISTEN_PORT=5050
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=True
      - PGADMIN_CONFIG_LOGIN_BANNER="OrderTech Development - Connect to 127.0.0.1:6555 (Cloud SQL) or 127.0.0.1:5432 (Local)"
    ports:
      - "5050:5050"
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin
    networks: [infra]
    restart: unless-stopped
    user: "5050:5050"

