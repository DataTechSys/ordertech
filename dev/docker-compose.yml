name: ordertech-dev

networks:
  infra:
    driver: bridge

services:
  # Redis (local development cache/session store)
  redis:
    image: redis:7-alpine
    container_name: ordertech-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [infra]
    restart: unless-stopped

  # Redis Commander (Redis admin UI)
  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: ordertech-redis-ui
    environment:
      - REDIS_HOSTS=local:ordertech-redis:6379
      - HTTP_USER=${REDIS_UI_USER:-}
      - HTTP_PASSWORD=${REDIS_UI_PASSWORD:-}
      - PORT=8081
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks: [infra]
    restart: unless-stopped

  # MinIO (S3-compatible local storage that mirrors Cloud Storage)
  minio:
    image: minio/minio:latest
    container_name: ordertech-minio
    command: server --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-ordertech-dev}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-ordertech-dev-secret}
      - MINIO_BROWSER_REDIRECT_URL=https://storage.localhost
      - MINIO_SERVER_URL=https://s3.localhost
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [infra]
    restart: unless-stopped

