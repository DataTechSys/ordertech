<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Koobs AI Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 700;
        }
        button {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6); 
        }
        .status {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .conversation {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            animation: fadeIn 0.5s ease-out;
        }
        .message.user { 
            background: linear-gradient(135deg, #2196F3, #21CBF3);
            margin-left: 20px;
        }
        .message.assistant { 
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            margin-right: 20px;
        }
        .message.system { 
            background: rgba(255, 255, 255, 0.1);
            font-style: italic;
            opacity: 0.8;
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .debug {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            margin: 20px 0;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Koobs AI Assistant</h1>
            <p>مساعد ذكي لمطعم كوبز</p>
        </div>

        <div class="controls" style="text-align: center;">
            <button onclick="testTauri()">Test Tauri</button>
            <button onclick="startConversation()">🎤 بدء المحادثة</button>
            <button onclick="stopConversation()">⏹️ إنهاء المحادثة</button>
        </div>

        <div id="status" class="status">جاهز للبداية - اضغط "بدء المحادثة"</div>
        <div id="conversation" class="conversation"></div>
        <div id="debug" class="debug">جاهز للتشغيل...</div>
    </div>

    <script>
        console.log('🚀 Koobs AI Assistant Loading...');
        
        // Check if we're running in Tauri
        const isTauri = window.__TAURI__ !== undefined;
        console.log('Running in Tauri:', isTauri);

        const BASE_URL = 'http://localhost:3000';
        
        // State management
        let isActive = false;
        let token = null;
        let sessionId = null;

        function log(message) {
            console.log(message);
            const debug = document.getElementById('debug');
            debug.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
        }

        function addMessage(type, text) {
            const conversation = document.getElementById('conversation');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const icon = type === 'user' ? '🗣️ أنت' : type === 'assistant' ? '🤖 كوبز' : '💻 النظام';
            div.innerHTML = `<strong>${icon}:</strong> ${text}`;
            conversation.appendChild(div);
            conversation.scrollTop = conversation.scrollHeight;
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function testTauri() {
            console.log('testTauri called');
            const debug = document.getElementById('debug');
            
            if (isTauri) {
                debug.innerHTML = '✅ Tauri detected!<br>';
                
                // Use the CORRECT Tauri API
                window.__TAURI__.tauri.invoke('greet', { name: 'World' })
                    .then(result => {
                        debug.innerHTML += '✅ Greet result: ' + result + '<br>';
                        log('Tauri invoke successful: ' + result);
                    })
                    .catch(error => {
                        debug.innerHTML += '❌ Greet error: ' + error + '<br>';
                        log('Tauri invoke error: ' + error);
                    });
            } else {
                debug.innerHTML = '❌ Tauri not detected';
                log('Tauri not available');
            }
        }

        async function startConversation() {
            try {
                log('🚀 Starting AI conversation...');
                isActive = true;
                updateStatus('جاري التهيئة...');
                
                // Initialize VAD if available
                if (isTauri) {
                    try {
                        await window.__TAURI__.tauri.invoke('initialize_vad');
                        log('✅ Native VAD initialized');
                        addMessage('system', 'Native VAD تم تفعيله');
                    } catch (vadError) {
                        log('⚠️ Native VAD failed: ' + vadError);
                        addMessage('system', 'VAD خطأ: ' + vadError);
                    }
                }

                // Mock AI session for testing
                addMessage('system', 'بدء جلسة AI...');
                
                // Simulate getting token
                updateStatus('جاري الحصول على الرمز...');
                setTimeout(() => {
                    token = 'mock-token-' + Date.now();
                    log('✅ Mock token received');
                    
                    // Simulate creating session
                    updateStatus('جاري إنشاء الجلسة...');
                    setTimeout(() => {
                        sessionId = 'session-' + Date.now();
                        log('✅ Mock session created: ' + sessionId);
                        addMessage('system', 'تم إنشاء الجلسة بنجاح');
                        
                        // AI greeting
                        addMessage('assistant', 'مرحباً وأهلاً وسهلاً في مطعم كوبز! كيف يمكنني مساعدتك اليوم؟');
                        updateStatus('في انتظار صوتك... تكلم!');
                        
                        // Start voice monitoring
                        startVoiceMonitoring();
                        
                    }, 1000);
                }, 1000);
                
            } catch (error) {
                log('❌ Startup error: ' + error.message);
                addMessage('system', 'خطأ في بدء المحادثة: ' + error.message);
                updateStatus('خطأ في التهيئة');
            }
        }

        async function startVoiceMonitoring() {
            if (!isActive) return;
            
            log('🎙️ Starting voice monitoring...');
            
            if (isTauri) {
                try {
                    await window.__TAURI__.tauri.invoke('start_vad_monitoring');
                    log('✅ Native VAD monitoring started');
                    updateStatus('في انتظار صوتك... (وضع محلي)');
                } catch (error) {
                    log('❌ VAD monitoring error: ' + error);
                    updateStatus('خطأ في مراقبة الصوت');
                }
            } else {
                log('📱 Browser fallback voice monitoring');
                updateStatus('في انتظار صوتك... (وضع متصفح)');
            }
        }

        function stopConversation() {
            log('🛑 Stopping conversation...');
            isActive = false;
            
            if (isTauri) {
                window.__TAURI__.tauri.invoke('stop_vad_monitoring')
                    .then(() => log('✅ VAD monitoring stopped'))
                    .catch(error => log('❌ Error stopping VAD: ' + error));
            }
            
            addMessage('system', 'تم إنهاء المحادثة');
            updateStatus('تم إنهاء المحادثة');
        }

        // Initialize
        log(isTauri ? 
            '🚀 Native Tauri app ready!' : 
            '📱 Browser mode - some features may be limited'
        );
        
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded, app ready');
            updateStatus('جاهز للبداية - اضغط "بدء المحادثة"');
        });
    </script>
</body>
</html>
