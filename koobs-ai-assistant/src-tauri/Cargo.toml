[package]
name = "koobs-ai-assistant"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "koobs_ai_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Audio dependencies commented out for initial testing
# cpal = "0.16"  # Cross-platform audio I/O
# webrtc-vad = "0.4"  # Google's WebRTC VAD
# rubato = "0.16"  # Audio resampling
# byteorder = "1.5"  # For audio data handling
reqwest = { version = "0.12", features = ["json"] }  # HTTP client for API calls
tracing = "0.1"  # Logging
tracing-subscriber = "0.3"  # Logging subscriber
chrono = { version = "0.4", features = ["serde"] }  # Date/time handling
base64 = "0.21"  # For audio data encoding
rodio = "0.17"  # Audio playback
bytes = "1.0"  # Byte handling

